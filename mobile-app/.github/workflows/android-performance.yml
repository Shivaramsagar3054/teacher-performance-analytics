name: Android Performance Testing Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  performance-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl matplotlib jinja2

      - name: Run Android Performance Tests
        run: |
          python performance_tests/run_performance_tests.py

      - name: Upload Performance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-performance-reports
          path: android-performance-reports/
          retention-days: 7
