name: backend-audit.yml

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Backend Framework
        id: detect-framework
        run: |
          if [ -f "backend/manage.py" ]; then
            echo "framework=django" >> $GITHUB_OUTPUT
            echo "Detected Django backend framework!"
          elif [ -f "backend/package.json" ]; then
            echo "framework=node" >> $GITHUB_OUTPUT
            echo "Detected Node.js backend framework!"
          else
            echo "framework=unknown" >> $GITHUB_OUTPUT
            echo "Unknown backend framework"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install semgrep pip-audit

      - name: Install Root Node Dependencies (for ExcelJS report generator)
        run: |
          npm install

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Semgrep SAST Scanner
        run: |
          semgrep --config=auto backend/ --sarif --output semgrep.sarif || true

      - name: Run Trivy Security Scan (FS Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend/'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1' # Fail workflow if Critical vulnerabilities are found

      - name: Run Dependency Vulnerability Audit
        run: |
          cd backend
          pip-audit -r requirements.txt || true

      - name: Run Django Unit & API Tests
        run: |
          cd backend
          python manage.py test apis

      - name: Run Performance / Load Tests
        run: |
          # Start Django dev server in background
          cd backend
          python manage.py runserver 127.0.0.1:8000 &
          SERVER_PID=$!
          
          echo "Waiting for Django server to start..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/api/homepage-hero/ > /dev/null; then
              echo "Server is up and running!"
              break
            fi
            echo "Waiting... (retry $i/15)"
            sleep 2
          done
          
          # Install k6 locally
          curl -L https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz | tar -xz
          mv k6-v0.50.0-linux-amd64/k6 .
          
          # Execute load test script
          echo "Running k6 baseline load test (100 users, 1 minute)..."
          ./k6 run "../automation/vulnerability-test-results/k6-load-test.js" --env BASE_URL=http://127.0.0.1:8000
          
          # Stop server
          kill $SERVER_PID

      - name: Generate Security spreadsheets
        if: always()
        run: |
          node "automation/vulnerability-test-results/generate-security-reports.js"

      - name: Upload Security Findings Spreadsheet & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            automation/vulnerability-test-results/
          retention-days: 30

      - name: Publish Security Summary to Step Summary
        if: always()
        run: |
          cat "automation/vulnerability-test-results/executive-summary.md" >> $GITHUB_STEP_SUMMARY || echo "No summary found"
