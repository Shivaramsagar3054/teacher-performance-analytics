name: backend-audit.yml

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  static-analysis:
    name: Run Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install semgrep pip-audit

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Semgrep SAST Scanner
        run: |
          semgrep --config=auto backend/ --sarif --output semgrep.sarif || true

      - name: Run Trivy Security Scan (FS Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend/'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Run Dependency Vulnerability Audit
        run: |
          cd backend
          pip-audit -r requirements.txt || true

  unit-tests:
    name: Run Unit and Functional API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Django Unit & API Tests
        run: |
          cd backend
          python manage.py test apis

  performance-tests:
    name: Run Baseline Performance and Load Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Performance / Load Tests
        run: |
          cd backend
          # Apply database migrations to initialize tables
          python manage.py migrate
          
          # Start Django dev server in background
          python manage.py runserver 127.0.0.1:8000 &
          SERVER_PID=$!
          
          echo "Waiting for Django server to start..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/api/homepage-hero/ > /dev/null; then
              echo "Server is up and running!"
              break
            fi
            echo "Waiting... (retry $i/15)"
            sleep 2
          done
          
          # Install k6 locally
          curl -L https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz | tar -xz
          mv k6-v0.50.0-linux-amd64/k6 .
          chmod +x k6
          
          # Execute load test script
          echo "Running k6 baseline load test (100 users, 1 minute)..."
          ./k6 run "../automation/vulnerability-test-results/k6-load-test.js" --env BASE_URL=http://127.0.0.1:8000
          
          # Stop server
          kill $SERVER_PID

  reporting:
    name: Generate Security spreadsheets & Summaries
    needs: [static-analysis, unit-tests, performance-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Root Node Dependencies
        run: |
          npm install

      - name: Generate Security spreadsheets
        run: |
          node "automation/vulnerability-test-results/generate-security-reports.js"

      - name: Upload Excel Findings Report
        uses: actions/upload-artifact@v4
        with:
          name: Security_Findings
          path: automation/vulnerability-test-results/findings.xlsx
          retention-days: 30

      - name: Upload Excel Endpoint Inventory
        uses: actions/upload-artifact@v4
        with:
          name: Endpoint_Inventory
          path: automation/vulnerability-test-results/endpoint-inventory.xlsx
          retention-days: 30

      - name: Upload Excel Test Cases
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerability_Test_Cases
          path: automation/vulnerability-test-results/test-cases.xlsx
          retention-days: 30

      - name: Upload Excel Dependency Vulnerabilities
        uses: actions/upload-artifact@v4
        with:
          name: Dependency_Vulnerabilities
          path: automation/vulnerability-test-results/dependency-vulnerabilities.xlsx
          retention-days: 30

      - name: Publish Security Summary to Step Summary
        run: |
          cat "automation/vulnerability-test-results/executive-summary.md" >> $GITHUB_STEP_SUMMARY || echo "No summary found"
