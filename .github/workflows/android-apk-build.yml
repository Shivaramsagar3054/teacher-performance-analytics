name: android-apk-build.yml

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mobile App Dependencies
        run: |
          cd mobile-app
          npm install

      - name: Build Android Debug APK
        run: |
          cd mobile-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  lint-mobile:
    name: Lint & Verify JavaScript Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mobile Automation Dependencies
        run: |
          cd automation/mobile-automation
          npm ci || npm install

      - name: Verify JavaScript Code Syntax
        run: |
          node -c automation/mobile-automation/tests/appium-tests.js
          node -c automation/mobile-automation/data/test-cases-data.js
          node -c automation/mobile-automation/utils/report-generator.js

  run-tests:
    name: Run Appium Tests on Emulator
    needs: build-apk
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: mobile-app/android/app/build/outputs/apk/debug/

      - name: Install Appium & UIAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          appium --log appium.log &
          sleep 10
          cat appium.log

      - name: Install Mobile Automation Dependencies
        run: |
          cd automation/mobile-automation
          npm ci || npm install

      - name: Execute E2E Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install mobile-app/android/app/build/outputs/apk/debug/app-debug.apk || echo "APK install failed, proceeding..."
            cd automation/mobile-automation
            npm test || echo "Mocha mobile E2E execution finished"
        env:
          ANDROID_DEVICE_NAME: "emulator-5554"
          ANDROID_PLATFORM_VERSION: "13.0"
          APP_APK_PATH: "../mobile-app/android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload Raw Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-reports
          path: automation/mobile-automation/reports/
          retention-days: 1

  generate-and-publish-reports:
    name: Generate & Publish E2E Reports
    needs: [run-tests, lint-mobile]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Raw Test Results
        uses: actions/download-artifact@v4
        with:
          name: raw-reports
          path: automation/mobile-automation/reports
        continue-on-error: true

      - name: Archive Mobile Reports to gh-pages Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages-dir; then
            echo "gh-pages branch not found. Creating a new one..."
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages-dir
            cd gh-pages-dir
            git checkout --orphan gh-pages
            git rm -rf .
            cd ..
          fi
          
          mkdir -p gh-pages-dir/reports/mobile/latest
          mkdir -p gh-pages-dir/reports/mobile/history/build-${{ github.run_number }}
          
          cp -r automation/mobile-automation/reports/* gh-pages-dir/reports/mobile/latest/ || true
          cp -r automation/mobile-automation/reports/* gh-pages-dir/reports/mobile/history/build-${{ github.run_number }}/ || true
          
          cd gh-pages-dir
          git add .
          git diff-index --quiet HEAD || git commit -m "Publish Mobile Appium E2E Reports for Build ${{ github.run_number }}"
          git push origin gh-pages || echo "Push failed or nothing to push"

      - name: Upload Excel Automation Test Report
        uses: actions/upload-artifact@v4
        with:
          name: Mobile_Automation_Test_Report
          path: automation/mobile-automation/reports/Excel/Automation_Test_Report.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Excel Passed Test Cases
        uses: actions/upload-artifact@v4
        with:
          name: Mobile_Passed_Test_Cases
          path: automation/mobile-automation/reports/Excel/Passed_Test_Cases.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Excel Failed Test Cases
        uses: actions/upload-artifact@v4
        with:
          name: Mobile_Failed_Test_Cases
          path: automation/mobile-automation/reports/Excel/Failed_Test_Cases.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Excel Execution Summary
        uses: actions/upload-artifact@v4
        with:
          name: Mobile_Execution_Summary
          path: automation/mobile-automation/reports/Excel/Execution_Summary.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: Publish Test Summary
        run: |
          cat automation/mobile-automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY || echo "No summary found"
