name: database-check.yml

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  db-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Dependencies
        run: |
          cd backend
          grep -vE 'opencv|mediapipe|sounddevice|matplotlib' requirements.txt > filtered_requirements.txt
          pip install -r filtered_requirements.txt

      - name: Run Migrations Check
        run: |
          cd backend
          python manage.py showmigrations
          python manage.py migrate --check
