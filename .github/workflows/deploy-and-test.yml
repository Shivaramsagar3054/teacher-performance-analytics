name: Selenium Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Website Dependencies
        run: |
          cd website
          npm ci || npm install

      - name: Build Application
        run: |
          cd website
          npm run build

      - name: Upload Website Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Website Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist

      - name: Deploy to gh-pages Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages-dir; then
            echo "gh-pages branch not found. Creating a new one..."
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages-dir
            cd gh-pages-dir
            git checkout --orphan gh-pages
            git rm -rf .
            cd ..
          fi
          
          cp -r website/dist/* gh-pages-dir/
          cd gh-pages-dir
          git add .
          git diff-index --quiet HEAD || git commit -m "Deploy Website Build ${{ github.run_number }}"
          git push origin gh-pages || exit 1

  verify:
    name: Verify Live Deployment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Deployment Readiness
        run: |
          BASE_URL="https://Shivaramsagar3054.github.io/teacher-performance-analytics/"
          echo "Verifying live page at $BASE_URL ..."
          for i in {1..15}; do
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$BASE_URL")
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 404 ]; then
              echo "Live deployment endpoint is responsive (HTTP status: $HTTP_STATUS)!"
              exit 0
            fi
            echo "Waiting for deployment... HTTP status: $HTTP_STATUS. Retrying in 10s..."
            sleep 10
          done
          echo "Deployment verification timed out."
          exit 1

  test-and-report:
    name: Run Selenium E2E Tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Automation Dependencies
        run: |
          cd automation/web-automation
          npm ci || npm install

      - name: Run Selenium E2E Tests
        run: |
          cd automation/web-automation
          npm test
        env:
          BASE_URL: "https://Shivaramsagar3054.github.io/teacher-performance-analytics/"
          HEADLESS: "true"

      - name: Upload Raw Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-raw-reports
          path: automation/web-automation/reports/
          retention-days: 1

      - name: Upload Excel Automation Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation_Test_Report
          path: automation/web-automation/reports/Excel/Automation_Test_Report.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Excel Passed Test Cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Passed_Test_Cases
          path: automation/web-automation/reports/Excel/Passed_Test_Cases.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Excel Failed Test Cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Failed_Test_Cases
          path: automation/web-automation/reports/Excel/Failed_Test_Cases.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Excel Summary Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Summary_Report
          path: automation/web-automation/reports/Excel/Summary_Report.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: Publish Test Summary
        if: always()
        run: |
          cat automation/web-automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY || echo "No summary found"
