name: Load Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  load-test:
    name: Run Baseline Load Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Performance / Load Tests
        run: |
          cd backend
          # Apply database migrations to initialize tables
          python manage.py migrate
          
          # Start Django dev server in background
          python manage.py runserver 127.0.0.1:8000 &
          SERVER_PID=$!
          
          echo "Waiting for Django server to start..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/api/homepage-hero/ > /dev/null; then
              echo "Server is up and running!"
              break
            fi
            echo "Waiting... (retry $i/15)"
            sleep 2
          done
          
          # Install k6 locally
          curl -L https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz | tar -xz
          mv k6-v0.50.0-linux-amd64/k6 .
          chmod +x k6
          
          # Execute load test script
          echo "Running k6 baseline load test (100 users, 1 minute)..."
          ./k6 run "../automation/vulnerability-test-results/k6-load-test.js" --env BASE_URL=http://127.0.0.1:8000 || echo "k6 baseline load test finished"
          
          # Stop server
          kill $SERVER_PID

      - name: Publish Performance Report to Step Summary
        if: always()
        run: |
          cat "automation/vulnerability-test-results/performance-report.md" >> $GITHUB_STEP_SUMMARY || echo "No performance report found"
